<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataccion — Mujeres en el Mercado Laboral Latinoamericano</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; }
        header { background: linear-gradient(135deg, #16213e, #0f3460); padding: 1.5rem 2rem; text-align: center; border-bottom: 3px solid #e94560; }
        header h1 { font-size: 1.6rem; margin-bottom: 0.3rem; color: #ffffff; }
        header p { font-size: 0.9rem; color: #a0a0b8; max-width: 800px; margin: 0 auto; }
        #dashboard-container {
            width: 100%; height: calc(100vh - 120px); min-height: 600px;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 1rem;
        }
        #dashboard-container iframe { width: 100%; height: 100%; border: none; }
        #status { color: #a0a0b8; font-size: 1rem; }
        #status.error { color: #e94560; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #e94560; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        footer { background: #16213e; padding: 0.8rem; text-align: center; font-size: 0.8rem; color: #a0a0b8; }
        footer a { color: #e94560; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <h1>Dataccion: Mujeres en el Mercado Laboral Latinoamericano</h1>
        <p>Panel de investigación — ONU Mujer | Barreras estructurales, económicas y culturales en 22+ países de ALC</p>
    </header>

    <div id="dashboard-container">
        <div class="spinner"></div>
        <p id="status">Conectando con Databricks...</p>
    </div>

    <footer>
        <p>Fuentes: Banco Mundial (2020-2024), OIT/ILO (2015-2025) |
        <a href="https://github.com/AnaPrec07/dataccion-agent">GitHub</a> |
        Powered by <a href="https://databricks.com">Databricks</a></p>
    </footer>

    <script>
        // ---- CONFIGURATION ----
        // Update PROXY_URL after deploying the Vercel proxy
        const PROXY_URL = 'https://embed-proxy-five.vercel.app/api/token';
        const WORKSPACE_ID = '1122590718777865';
        const DASHBOARD_ID = '01f13543b2471c588e09533c84552e54';

        const container = document.getElementById('dashboard-container');
        const status = document.getElementById('status');

        function showDashboard(instanceUrl, token) {
            // Try Embed SDK first
            const script = document.createElement('script');
            script.src = `${instanceUrl}/embed/sdk.js`;
            script.onload = () => {
                if (window.DatabricksDashboard) {
                    container.innerHTML = '<div id="db-embed" style="width:100%;height:100%;"></div>';
                    const dashboard = new DatabricksDashboard({
                        instanceUrl: instanceUrl,
                        workspaceId: WORKSPACE_ID,
                        dashboardId: DASHBOARD_ID,
                        token: token,
                        container: document.getElementById('db-embed'),
                        config: { version: 1, hideDatabricksLogo: false }
                    });
                    dashboard.initialize();
                } else {
                    fallbackIframe(instanceUrl);
                }
            };
            script.onerror = () => fallbackIframe(instanceUrl);
            document.head.appendChild(script);
        }

        function fallbackIframe(instanceUrl) {
            const url = `${instanceUrl}/embed/dashboardsv3/${DASHBOARD_ID}?o=${WORKSPACE_ID}`;
            container.innerHTML = `<iframe src="${url}" width="100%" height="100%" style="border:none;min-height:600px;" allowfullscreen></iframe>`;
        }

        async function init() {
            try {
                status.textContent = 'Obteniendo credenciales...';
                const resp = await fetch(PROXY_URL);

                if (!resp.ok) {
                    throw new Error(`Proxy returned ${resp.status}`);
                }

                const data = await resp.json();
                status.textContent = 'Cargando dashboard...';
                showDashboard(data.instance_url, data.token);

                // Auto-refresh token before expiry (refresh at 50 min of 60 min lifetime)
                setTimeout(() => init(), (data.expires_in - 600) * 1000);

            } catch (err) {
                console.warn('Proxy unavailable, falling back to iframe:', err.message);
                status.textContent = '';
                fallbackIframe('https://dbc-779d0bf6-94c0.cloud.databricks.com');
            }
        }

        init();
    </script>
</body>
</html>
